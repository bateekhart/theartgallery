<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الأعمال — ذا آرت جاليري</title>
  <meta name="description" content="الأعمال الفنية التي عُرضت في معارض ذا آرت جاليري، مصنّفة حسب المعرض.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="../../assets/mark.svg" type="image/svg+xml">
  <link rel="alternate" hreflang="en" href="https://theartgallery.world/artworks/">
  <link rel="alternate" hreflang="ar" href="https://theartgallery.world/ar/artworks/">
  <meta property="og:title" content="الأعمال — ذا آرت جاليري">
  <meta property="og:description" content="الأعمال الفنية التي عُرضت في معارض ذا آرت جاليري، مصنّفة حسب المعرض.">
  <meta property="og:image" content="https://theartgallery.world/assets/img/hero-stairwell.jpg">
  <meta property="og:url" content="https://theartgallery.world/ar/artworks/">
  <meta property="og:locale" content="ar_EG">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500&family=Urbanist:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css">
</head>
<body data-page="artworks" data-base="../../" data-path="artworks/">

<header id="site-header"></header>

<main id="main">
  <section class="page-head">
    <div class="wrap">
      <div class="reveal">
        <p class="eyebrow"><span class="level">الأعمال</span></p>
        <h1 class="display">كل عمل<span><em>عُرض على جدراننا.</em></span></h1>
        <p class="lede">تصفّح الأعمال حسب المعرض، أو ابحث باسم الفنان أو العنوان. اضغط على أي عمل لمشاهدته بالحجم الكامل.</p>
      </div>
    </div>
  </section>
  <div class="filters">
    <div class="wrap">
      <div class="chips" id="chips" role="group" aria-label="المعارض"></div>
      <div class="filter-row">
        <label class="search"><span class="visually-hidden">ابحث</span><input id="q" type="search" placeholder="ابحث بالفنان أو العنوان" autocomplete="off"></label>
        <span class="works-count" id="works-count" aria-live="polite"></span>
      </div>
    </div>
  </div>
  <section class="section tight" style="padding-top:0">
    <div class="wrap">
      <div id="ex-note"></div>
      <ul class="masonry" id="works"></ul>
      <p class="empty" id="works-empty" hidden>لا توجد نتائج.</p>
      <button class="btn ghost more-btn" id="more" type="button" hidden>عرض المزيد</button>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="../../assets/data.js"></script>
<script src="../../assets/works.js"></script>
<script src="../../assets/app.js"></script>
</body>
</html>
