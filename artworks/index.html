<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artworks — the ART GALLERY</title>
  <meta name="description" content="Artworks shown in the ART GALLERY's exhibitions, by exhibition.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="alternate" hreflang="en" href="https://theartgallery.world/artworks/">
  <link rel="alternate" hreflang="ar" href="https://theartgallery.world/ar/artworks/">
  <meta property="og:title" content="Artworks — the ART GALLERY">
  <meta property="og:description" content="Artworks shown in the ART GALLERY's exhibitions, by exhibition.">
  <meta property="og:image" content="https://theartgallery.world/assets/img/hero-stairwell.jpg">
  <meta property="og:url" content="https://theartgallery.world/artworks/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500&family=Urbanist:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="artworks" data-base="../" data-path="artworks/">

<header id="site-header"></header>

<main id="main">
  <section class="page-head">
    <div class="wrap">
      <div class="reveal">
        <p class="eyebrow"><span class="level">Artworks</span></p>
        <h1 class="display">Every piece<span><em>that met our walls.</em></span></h1>
        <p class="lede">Browse by exhibition, or search by artist or title. Select any piece to see it full screen.</p>
      </div>
    </div>
  </section>
  <div class="filters">
    <div class="wrap">
      <div class="chips" id="chips" role="group" aria-label="Exhibitions"></div>
      <div class="filter-row">
        <label class="search"><span class="visually-hidden">Search</span><input id="q" type="search" placeholder="Search by artist or title" autocomplete="off"></label>
        <span class="works-count" id="works-count" aria-live="polite"></span>
      </div>
    </div>
  </div>
  <section class="section tight" style="padding-top:0">
    <div class="wrap">
      <div id="ex-note"></div>
      <ul class="masonry" id="works"></ul>
      <p class="empty" id="works-empty" hidden>Nothing matches that search.</p>
      <button class="btn ghost more-btn" id="more" type="button" hidden>Show more</button>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="../assets/data.js"></script>
<script src="../assets/works.js"></script>
<script src="../assets/app.js"></script>
</body>
</html>
